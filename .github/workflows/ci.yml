name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Install lint dependency
        run: python -m pip install ruff==0.15.12
      - name: Ruff
        run: ruff check --no-cache template/.harness/harness.py integrations/github/publish_check.py tests
      - name: Node unit tests
        run: node --test examples/todo/test.mjs
      - name: Harness doctor
        run: |
          python template/.harness/harness.py --workspace template doctor
          python template/.harness/harness.py --workspace examples/todo doctor
      - name: Example Harness check
        run: python template/.harness/harness.py --workspace examples/todo run check

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install development browser dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real Chromium acceptance
        shell: bash
        run: |
          set -euo pipefail
          python template/.harness/harness.py --workspace examples/todo run start >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          python tests/todo_browser_acceptance.py
