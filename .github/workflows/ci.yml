name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Real release smoke check
        id: release_smoke
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        run: python scripts/check_release.py --ref "${{ github.sha }}" --version v0.0.0-ci --output-dir release-smoke
      - name: Upload release smoke diagnostics
        if: ${{ failure() && steps.release_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            release-smoke/
            !release-smoke/smoke-project/.git/
            !release-smoke/smoke-project/.git/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Install lint dependency
        run: python -m pip install ruff==0.15.12
      - name: Ruff
        run: ruff check --no-cache template/.harness integrations/github/publish_check.py scripts tests examples/quickstart
      - name: Node unit tests
        run: node --test examples/todo/test.mjs
      - name: First-use PowerShell walkthrough
        if: ${{ runner.os == 'Windows' && matrix.python-version == '3.9' }}
        shell: pwsh
        run: ./tests/run_first_use_windows.ps1
      - name: Harness doctor
        run: |
          python template/.harness/harness.py --workspace template doctor
          python template/.harness/harness.py --workspace examples/todo doctor
      - name: Example Harness check
        run: python template/.harness/harness.py --workspace examples/todo run check

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install development browser dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real Chromium acceptance
        run: python tests/run_todo_walkthrough.py
